name: Jekyll build

on:
  # Run after bad-pr check
  workflow_run:
    workflows: ["Cleanup bad PR"]
    branches: [main]
    types:
      - completed
  # Allows the site build to be checked manually
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Inspect rendered homepage and publications
        run: |
          echo "Generated publication pages:"
          find _site/publication -name index.html
          echo "About page profile:"
          grep -o '<h3 class="author__name">[^<]*</h3>' _site/index.html
          echo "About page publication titles:"
          grep -o 'archive__item-title\|SynLogic[^<]*\|Perception Bottleneck[^<]*\|Universal Truthfulness[^<]*\|In-Context Sharpness[^<]*\|C-Eval[^<]*\|Composing Parameter-Efficient[^<]*' _site/index.html
          echo "Publications page entries:"
          grep -o '<h2 class="archive__item-title"[^>]*>.*\|Published in <i>[^<]*</i>[^<]*' _site/publications/index.html
